<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="title desc"><title id="title">Plano de plaza y biblioteca</title><desc id="desc">Norte arriba. La biblioteca se ubica dos cuadras al este y una al sur de la plaza.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="#17324d"><text x="330" y="27" text-anchor="middle">Plano del barrio • cada tramo equivale a una cuadra</text><path d="M120 70V310" stroke="#bac7d2" stroke-width="4"/><path d="M240 70V310" stroke="#bac7d2" stroke-width="4"/><path d="M360 70V310" stroke="#bac7d2" stroke-width="4"/><path d="M480 70V310" stroke="#bac7d2" stroke-width="4"/><path d="M600 70V310" stroke="#bac7d2" stroke-width="4"/><path d="M120 70H600" stroke="#bac7d2" stroke-width="4"/><path d="M120 150H600" stroke="#bac7d2" stroke-width="4"/><path d="M120 230H600" stroke="#bac7d2" stroke-width="4"/><path d="M120 310H600" stroke="#bac7d2" stroke-width="4"/><circle cx="240" cy="150" r="7" fill="#28765b"/><text x="250" y="138">Plaza</text><circle cx="480" cy="230" r="7" fill="#ba4624"/><text x="420" y="264">Biblioteca</text><path d="M60 155V70L50 88M60 70L70 88" fill="none" stroke="#17324d" stroke-width="3"/><text x="53" y="58">N</text></g></svg>