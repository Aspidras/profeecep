<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-labelledby="title desc"><title id="title">Coordenadas geográficas</title><desc id="desc">P se ubica 35 grados al sur del ecuador y 70 grados al oeste de Greenwich.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="#17324d"><text x="330" y="28" text-anchor="middle">Red de coordenadas geográficas</text><path d="M580 70V290" stroke="#aac"/><text x="580" y="319" text-anchor="middle">0°</text><path d="M520 70V290" stroke="#aac"/><text x="520" y="319" text-anchor="middle">10° O</text><path d="M460 70V290" stroke="#aac"/><text x="460" y="319" text-anchor="middle">20° O</text><path d="M400 70V290" stroke="#aac"/><text x="400" y="319" text-anchor="middle">30° O</text><path d="M340 70V290" stroke="#aac"/><text x="340" y="319" text-anchor="middle">40° O</text><path d="M280 70V290" stroke="#aac"/><text x="280" y="319" text-anchor="middle">50° O</text><path d="M220 70V290" stroke="#aac"/><text x="220" y="319" text-anchor="middle">60° O</text><path d="M160 70V290" stroke="#aac"/><text x="160" y="319" text-anchor="middle">70° O</text><path d="M100 70V290" stroke="#aac"/><text x="100" y="319" text-anchor="middle">80° O</text><path d="M90 80H590" stroke="#aac"/><text x="77" y="86" text-anchor="end">0°</text><path d="M90 130H590" stroke="#aac"/><text x="77" y="136" text-anchor="end">10° S</text><path d="M90 180H590" stroke="#aac"/><text x="77" y="186" text-anchor="end">20° S</text><path d="M90 230H590" stroke="#aac"/><text x="77" y="236" text-anchor="end">30° S</text><path d="M90 280H590" stroke="#aac"/><text x="77" y="286" text-anchor="end">40° S</text><path d="M90 80H590 M580 70V290" stroke="#17324d" stroke-width="3"/><text x="340" y="65">Ecuador</text><text x="605" y="210" transform="rotate(-90 605 210)">Greenwich</text><circle cx="160" cy="255" r="7" fill="#ba4624"/><text x="174" y="261">P (35° S; 70° O)</text><text x="95" y="350">Esquema de paralelos y meridianos. Norte hacia arriba.</text></g></svg>