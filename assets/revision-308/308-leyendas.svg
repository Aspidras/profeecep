<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="title desc"><title id="title">Dos mapas temáticos</title><desc id="desc">La zona P es oscura en ambos mapas. En A oscuro significa al menos 50 habitantes por km²; en B al menos 1000 metros de altitud.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="#17324d"><text x="165" y="30" text-anchor="middle">Mapa A: densidad</text><text x="485" y="30" text-anchor="middle">Mapa B: altitud</text><rect x="70" y="60" width="90" height="135" fill="#cbdfe3" stroke="#17324d"/><rect x="160" y="60" width="100" height="135" fill="#28765b" stroke="#17324d"/><text x="210" y="133" fill="white" text-anchor="middle">P</text><rect x="390" y="60" width="90" height="135" fill="#cbdfe3" stroke="#17324d"/><rect x="480" y="60" width="100" height="135" fill="#28765b" stroke="#17324d"/><text x="530" y="133" fill="white" text-anchor="middle">P</text><text x="70" y="237">Claro: 0–49 hab./km²</text><text x="70" y="267">Oscuro: ≥50 hab./km²</text><text x="390" y="237">Claro: 0–999 m</text><text x="390" y="267">Oscuro: ≥1.000 m</text><text x="330" y="325" text-anchor="middle">Mismo territorio esquemático; norte arriba.</text></g></svg>