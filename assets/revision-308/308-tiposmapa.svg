<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-labelledby="title desc"><title id="title">Representaciones física y política</title><desc id="desc">Mapa A muestra franjas de altitud. Mapa B muestra tres regiones con límites administrativos.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="#17324d"><text x="160" y="28" text-anchor="middle">Mapa A</text><text x="490" y="28" text-anchor="middle">Mapa B</text><rect x="50" y="55" width="220" height="185" fill="#d9ead3" stroke="#17324d"/><path d="M190 55Q140 100 190 145T200 240H270V55Z" fill="#cda577"/><path d="M235 55Q195 120 240 190L255 240H270V55Z" fill="#a87755"/><rect x="380" y="55" width="220" height="185" fill="#eef1f3" stroke="#17324d"/><path d="M380 120L495 150L600 100M495 150L530 240" stroke="#28765b" stroke-width="3" fill="none"/><text x="420" y="95">R1</text><text x="410" y="195">R2</text><text x="550" y="190">R3</text><text x="50" y="278">Verde: 0–499 m</text><text x="50" y="305">Café claro: 500–1.499 m</text><text x="50" y="332">Café oscuro: ≥1.500 m</text><text x="380" y="278">Líneas: límites regionales</text><text x="380" y="305">R1, R2 y R3: regiones</text><text x="330" y="375" text-anchor="middle">Territorio didáctico esquemático; norte arriba.</text></g></svg>