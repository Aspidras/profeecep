<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" role="img" aria-labelledby="title desc"><title id="title">Distancia representada en un mapa</title><desc id="desc">Segmento A-B mide 3 cm en el mapa original. Escala 1 a 100.000.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="18" fill="#17324d"><text x="330" y="35" text-anchor="middle">Segmento en un mapa a escala 1:100.000</text><path d="M120 175H540M120 160V190M540 160V190" stroke="#17324d" stroke-width="4"/><text x="120" y="220" text-anchor="middle">A</text><text x="540" y="220" text-anchor="middle">B</text><text x="330" y="150" text-anchor="middle">3 cm en el mapa original</text><text x="330" y="280" text-anchor="middle">Usa la medida indicada; el tamaño en pantalla puede variar.</text></g></svg>