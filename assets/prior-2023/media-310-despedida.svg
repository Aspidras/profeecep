<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title desc"><title id="title">Despedida</title><desc id="desc">Primera viñeta: dos personas unidas por un hilo rojo entre sus pechos se toman las manos. Segunda: se alejan en direcciones opuestas; el hilo sigue uniéndolas. Una dice Te escribiré.</desc><rect width="640" height="540" rx="18" fill="#f5f9fc"/><g fill="#17374a" font-family="Arial, sans-serif"><rect x="20" y="18" width="600" height="232" rx="10" fill="white" stroke="#628093" stroke-width="3"/><rect x="20" y="270" width="600" height="250" rx="10" fill="white" stroke="#628093" stroke-width="3"/><text x="48" y="50" font-size="24" font-weight="bold" text-anchor="middle">1</text><g transform="translate(263 150) scale(1)" stroke="#26566b" stroke-width="7" fill="none" stroke-linecap="round"><circle cy="-43" r="17" fill="#26566b"/><path d="M0 -20V37M-27 5L0 -12L27 5M0 37L-23 74M0 37L23 74"/></g><g transform="translate(377 150) scale(1)" stroke="#26566b" stroke-width="7" fill="none" stroke-linecap="round"><circle cy="-43" r="17" fill="#26566b"/><path d="M0 -20V37M-27 5L0 -12L27 5M0 37L-23 74M0 37L23 74"/></g><path d="M290 155L350 155" stroke="#26566b" stroke-width="7"/><path d="M263 142Q320 98 377 142" stroke="#ae2941" stroke-width="6" fill="none"/><text x="48" y="302" font-size="24" font-weight="bold" text-anchor="middle">2</text><g transform="translate(160 406) scale(1)" stroke="#26566b" stroke-width="7" fill="none" stroke-linecap="round"><circle cy="-43" r="17" fill="#26566b"/><path d="M0 -20V37M-27 5L0 -12L27 5M0 37L-23 74M0 37L23 74"/></g><g transform="translate(480 406) scale(1)" stroke="#26566b" stroke-width="7" fill="none" stroke-linecap="round"><circle cy="-43" r="17" fill="#26566b"/><path d="M0 -20V37M-27 5L0 -12L27 5M0 37L-23 74M0 37L23 74"/></g><path d="M160 398Q320 463 480 398" stroke="#ae2941" stroke-width="6" fill="none"/><text x="448" y="333" font-size="25" font-weight="normal" text-anchor="middle">Te escribir