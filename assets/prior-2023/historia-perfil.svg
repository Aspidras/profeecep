<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="title desc"><title id="title">Perfil del sur de Chile</title><desc id="desc">De oeste a este: océano, cordillera de la Costa, depresión intermedia y Andes. La depresión es amplia y más baja que ambas cordilleras.</desc><rect width="840" height="520" fill="#fff"/><g font-family="Arial, sans-serif"><text x="30" y="38" font-size="26" text-anchor="start" fill="#17324d">Perfil esquemático: oeste → este</text><text x="30" y="68" font-size="18" text-anchor="start" fill="#17324d">Alturas didácticas · sin escala horizontal</text><path d="M 65 365.0 H 800" stroke="#d4dee5"/><text x="55" y="371.0" font-size="15" text-anchor="end" fill="#17324d">0</text><path d="M 65 320.0 H 800" stroke="#d4dee5"/><text x="55" y="326.0" font-size="15" text-anchor="end" fill="#17324d">500</text><path d="M 65 275.0 H 800" stroke="#d4dee5"/><text x="55" y="281.0" font-size="15" text-anchor="end" fill="#17324d">1000</text><path d="M 65 230.0 H 800" stroke="#d4dee5"/><text x="55" y="236.0" font-size="15" text-anchor="end" fill="#17324d">1500</text><path d="M 65 185.0 H 800" stroke="#d4dee5"/><text x="55" y="191.0" font-size="15" text-anchor="end" fill="#17324d">2000</text><path d="M 65 140.0 H 800" stroke="#d4dee5"/><text x="55" y="146.0" font-size="15" text-anchor="end" fill="#17324d">2500</text><polygon points="65,390 65,365.0 125,365.0 155,354.2 180,333.5 205,293.0 230,320.0 258,349.7 290,356.0 340,354.2 390,350.6 440,347.0 490,349.7 530,324.5 575,284.0 605,257.0 645,207.5 675,167.0 710,212.0 750,185.0 790,248.0 790,390" fill="#d6e6cf"/><polyline points="65,365.0 125,365.0 155,354.2 180,333.5 205,293.0 230,320.0 258,349.7 290,356.0 340,354.2 390,350.6 440,347.0 490,349.7 530,324.5 575,284.0 605,257.0 645,207.5 675,167.0 710,212.0 750,185.0 790,248.0" fill="none" stroke="#376847" stroke-width="3"/><path d="M 65 365 H 800" stroke="#17324d" stroke-width="1.5"/><path d="M 65 366 H 125" stroke="#428cb7" stroke-width="5"/><text x="40" y="107" font-size="16" text-anchor="start" fill="#17324d">m</text><text x="97" y="413" font-size="18" text-anchor="middle" fill="#17324d">Océano</text><text x="203" y="443" font-size="19" text-anchor="middle" fill="#17324d">Costa</text><text x="382" y="443" font-size="19" text-anchor="middle" fill="#17324d">Depresión intermedia</text><text x="676" y="443" font-size="19" text-anchor="middle" fill="#17324d">Andes</text><text x="205" y="273" font-size="18" text-anchor="middle" fill="#17324d">800 m</text><text x="380" y="327" font-size="18" text-anchor="middle" fill="#17324d">100–200 m</text><text x="675" y="148" font-size="18" text-anchor="middle" fill="#17324d">2200 m</text><text x="30" y="487" font-size="17" text-anchor="start" fill="#17324d">Esquema para comparar unidades de relieve; no es un levantamiento real.</text></g></svg>
