<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Radio Patio</title><desc id="desc">Semana del campeonato escolar. Todo gira alrededor del balón. Partidos, entrevistas y resultados, cada tarde. Un balón central y puntos sobre una órbita.</desc><rect width="640" height="400" rx="18" fill="#f5f9fc"/><g fill="#17374a" font-family="Arial, sans-serif"><text x="320" y="43" font-size="31" font-weight="bold" text-anchor="middle">RADIO PATIO</text><text x="320" y="83" font-size="25" font-weight="normal" text-anchor="middle">Semana del campeonato escolar</text><ellipse cx="320" cy="191" rx="220" ry="57" fill="none" stroke="#7095ad" stroke-width="3"/><circle cx="320" cy="190" r="62" fill="white" stroke="#17374a" stroke-width="3"/><path d="M320 152L349 174L338 209H302L291 174Z" fill="#17374a"/><circle cx="106" cy="178" r="10" fill="#b64a3a"/><circle cx="469" cy="232" r="10" fill="#2d7b66"/><circle cx="462" cy="147" r="10" fill="#b28b32"/><text x="320" y="300" font-size="29" font-weight="bold" text-anchor="middle">Todo gira alrededor del balón</text><text x="320" y="344" font-size="24" font-weight="normal" text-anchor="middle">Partidos, entrevistas y resultados</text><text x="320" y="374" font-size="24" font-weight="normal" text-anchor="middle">cada tarde</text></g></svg>
